[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "slitlamp-studio"
version = "0.1.0"
description = "Local desktop capture and image management for slit lamp clinics"
requires-python = ">=3.11"
dependencies = [
  "PySide6>=6.8,<7", "Pillow>=11,<13", "openpyxl>=3.1,<4",
  "pydicom>=3,<4", "pynetdicom>=3,<4", "imageio-ffmpeg>=0.6,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-qt>=4.4,<5", "ruff>=0.12,<1", "pyinstaller>=6,<7"]

[project.gui-scripts]
slitlamp-studio = "slitlamp.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
qt_api = "pyside6"

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
